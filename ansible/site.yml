---
- name: Configure E-Waste Pickup target node
  hosts: ewaste
  become: true

  tasks:
    # ---------- packages ----------
    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - openjdk-17-jre-headless
          - mysql-server
          - python3-pymysql
          - curl
        state: present
        update_cache: true
        cache_valid_time: 3600

    # ---------- users and folders ----------
    - name: Create application group
      ansible.builtin.group:
        name: "{{ app_group }}"
        system: true

    - name: Create application user
      ansible.builtin.user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Create application folders
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ app_group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ app_home }}", owner: "{{ app_user }}", mode: "0755" }
        - { path: "{{ app_home }}/releases", owner: "{{ app_user }}", mode: "0755" }
        - { path: "{{ app_conf_dir }}", owner: root, mode: "0750" }
        - { path: "{{ app_log_dir }}", owner: "{{ app_user }}", mode: "0755" }

    # ---------- database service ----------
    - name: Ensure MySQL is running and enabled
      ansible.builtin.service:
        name: mysql
        state: started
        enabled: true

    - name: Create application database
      community.mysql.mysql_db:
        name: "{{ db_name }}"
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock

    - name: Create application database user
      community.mysql.mysql_user:
        name: "{{ db_user }}"
        password: "{{ db_password }}"
        priv: "{{ db_name }}.*:ALL"
        host: localhost
        state: present
        login_unix_socket: /var/run/mysqld/mysqld.sock
      no_log: true

    # ---------- configuration files ----------
    - name: Install environment file (holds DB credentials)
      ansible.builtin.template:
        src: ewaste.env.j2
        dest: "{{ app_conf_dir }}/ewaste.env"
        owner: root
        group: "{{ app_group }}"
        mode: "0640"
      no_log: true
      notify: Restart ewaste

    - name: Install systemd unit
      ansible.builtin.template:
        src: ewaste.service.j2
        dest: /etc/systemd/system/ewaste.service
        mode: "0644"
      notify:
        - Reload systemd
        - Restart ewaste

    # ---------- release ----------
    - name: Create release folder
      ansible.builtin.file:
        path: "{{ app_home }}/releases/{{ app_version }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0755"

    - name: Copy application jar into the release folder
      ansible.builtin.copy:
        src: "{{ app_jar_src }}"
        dest: "{{ app_home }}/releases/{{ app_version }}/app.jar"
        force: false
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0644"
      notify: Restart ewaste

    - name: Point 'current' at this release
      ansible.builtin.file:
        src: "{{ app_home }}/releases/{{ app_version }}"
        dest: "{{ app_home }}/current"
        state: link
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
      notify: Restart ewaste

    - name: Apply pending handlers before starting the service
      ansible.builtin.meta: flush_handlers

    - name: Ensure application service is enabled and running
      ansible.builtin.systemd:
        name: ewaste
        state: started
        enabled: true
        daemon_reload: true

    # ---------- health check ----------
    - name: Wait for the application to answer
      ansible.builtin.uri:
        url: "http://localhost:{{ app_port }}/api/slots"
        status_code: 200
      register: health
      retries: 30
      delay: 3
      until: health.status == 200

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart ewaste
      ansible.builtin.systemd:
        name: ewaste
        state: restarted
        daemon_reload: true
