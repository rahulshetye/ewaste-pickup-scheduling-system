<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E-Waste Pickup Scheduler</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 860px; margin: 24px auto; padding: 0 16px; color: #1f2937; }
    section { border: 1px solid #d1d5db; border-radius: 8px; padding: 16px; margin: 16px 0; }
    label { display: block; margin: 8px 0 2px; font-size: 14px; }
    input { padding: 6px 8px; width: 260px; }
    button { padding: 6px 14px; margin-top: 10px; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border-bottom: 1px solid #e5e7eb; padding: 6px 8px; text-align: left; }
    .msg { margin-top: 8px; font-size: 14px; min-height: 18px; }
    .ok { color: #047857; }
    .err { color: #b91c1c; }
  </style>
</head>
<body>
  <h1>E-Waste Pickup Scheduler</h1>
  <p id="current-user">Not registered yet</p>

  <section>
    <h2>1. Register</h2>
    <label for="reg-name">Name</label>
    <input id="reg-name" placeholder="Your name">
    <label for="reg-email">Email</label>
    <input id="reg-email" placeholder="you@example.com">
    <label for="reg-password">Password</label>
    <input id="reg-password" type="password" placeholder="Password">
    <div><button id="reg-submit">Register</button></div>
    <div id="reg-message" class="msg"></div>
  </section>

  <section>
    <h2>2. Add a pickup slot (admin)</h2>
    <label for="slot-date">Date</label>
    <input id="slot-date" placeholder="YYYY-MM-DD">
    <label for="slot-start">Start time</label>
    <input id="slot-start" placeholder="HH:MM">
    <label for="slot-end">End time</label>
    <input id="slot-end" placeholder="HH:MM">
    <label for="slot-area">Area</label>
    <input id="slot-area" placeholder="Andheri">
    <div><button id="slot-submit">Create slot</button></div>
    <div id="slot-message" class="msg"></div>
  </section>

  <section>
    <h2>3. Available slots</h2>
    <button id="refresh-slots">Refresh slots</button>
    <div id="slots-message" class="msg"></div>
    <table id="slots-table">
      <thead><tr><th>ID</th><th>Date</th><th>Time</th><th>Area</th><th></th></tr></thead>
      <tbody id="slots-body"></tbody>
    </table>
  </section>

  <section>
    <h2>4. My bookings</h2>
    <button id="refresh-bookings">Refresh bookings</button>
    <div id="bookings-message" class="msg"></div>
    <table id="bookings-table">
      <thead><tr><th>Booking</th><th>Slot</th><th>Status</th><th></th></tr></thead>
      <tbody id="bookings-body"></tbody>
    </table>
  </section>

  <script>
    let userId = null;
    const el = id => document.getElementById(id);

    function setMsg(id, text, ok) {
      el(id).textContent = text;
      el(id).className = 'msg ' + (ok ? 'ok' : 'err');
    }

    async function readError(res) {
      const text = await res.text();
      return text || ('Request failed (' + res.status + ')');
    }

    function sendJson(url, method, body) {
      return fetch(url, {
        method: method,
        headers: { 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined
      });
    }

    el('reg-submit').addEventListener('click', async () => {
      const res = await sendJson('/api/auth/register', 'POST', {
        name: el('reg-name').value,
        email: el('reg-email').value,
        password: el('reg-password').value
      });
      if (res.ok) {
        const user = await res.json();
        userId = user.id;
        el('current-user').textContent = 'Signed in as ' + user.name + ' (user id ' + user.id + ')';
        setMsg('reg-message', 'Registered successfully. User id: ' + user.id, true);
        loadBookings();
      } else {
        setMsg('reg-message', await readError(res), false);
      }
    });

    el('slot-submit').addEventListener('click', async () => {
      const res = await sendJson('/api/admin/slots', 'POST', {
        date: el('slot-date').value,
        startTime: el('slot-start').value,
        endTime: el('slot-end').value,
        area: el('slot-area').value
      });
      if (res.ok) {
        const slot = await res.json();
        setMsg('slot-message', 'Slot created in ' + slot.area + ' (id ' + slot.id + ')', true);
      } else {
        setMsg('slot-message', await readError(res), false);
      }
    });

    async function loadSlots() {
      const res = await fetch('/api/slots');
      const slots = await res.json();
      const body = el('slots-body');
      body.innerHTML = '';
      slots.forEach(s => {
        const tr = document.createElement('tr');
        tr.id = 'slot-' + s.id;
        tr.innerHTML = '<td>' + s.id + '</td><td>' + s.date + '</td><td>' + s.startTime + ' - ' + s.endTime +
          '</td><td class="slot-area"></td><td><button id="book-' + s.id + '">Book</button></td>';
        tr.querySelector('.slot-area').textContent = s.area;
        tr.querySelector('button').addEventListener('click', () => bookSlot(s.id));
        body.appendChild(tr);
      });
      setMsg('slots-message', slots.length + ' slot(s) available', true);
    }

    async function bookSlot(slotId) {
      if (userId === null) {
        setMsg('slots-message', 'Please register first', false);
        return;
      }
      const res = await sendJson('/api/bookings', 'POST', { userId: userId, slotId: slotId });
      if (res.ok) {
        const b = await res.json();
        await loadSlots();
        await loadBookings();
        setMsg('slots-message', 'Booking ' + b.id + ' ' + b.status, true);
      } else {
        setMsg('slots-message', await readError(res), false);
      }
    }

    async function loadBookings() {
      if (userId === null) {
        setMsg('bookings-message', 'Please register first', false);
        return;
      }
      const res = await fetch('/api/bookings/user/' + userId);
      const list = await res.json();
      const body = el('bookings-body');
      body.innerHTML = '';
      list.forEach(b => {
        const tr = document.createElement('tr');
        tr.id = 'booking-' + b.id;
        const cancelCell = b.status === 'CANCELLED' ? '' : '<button id="cancel-' + b.id + '">Cancel</button>';
        tr.innerHTML = '<td>' + b.id + '</td><td>' + b.slotId + '</td><td class="status">' + b.status +
          '</td><td>' + cancelCell + '</td>';
        const btn = tr.querySelector('button');
        if (btn) btn.addEventListener('click', () => cancelBooking(b.id));
        body.appendChild(tr);
      });
      setMsg('bookings-message', list.length + ' booking(s)', true);
    }

    async function cancelBooking(bookingId) {
      const res = await sendJson('/api/bookings/' + bookingId + '/cancel', 'PUT');
      if (res.ok) {
        await loadBookings();
        await loadSlots();
      } else {
        setMsg('bookings-message', await readError(res), false);
      }
    }

    el('refresh-slots').addEventListener('click', loadSlots);
    el('refresh-bookings').addEventListener('click', loadBookings);
    loadSlots();
  </script>
</body>
</html>
